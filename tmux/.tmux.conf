# tmux内でも同じ色が出るように設定
set-option -g default-terminal screen-256color
set -g terminal-overrides 'xterm:colors=256'

# セッションがない状態で tmux a で起動すると画面を4分割した状態で始まる
new-session -d
split-window -h
split-window -v
select-pane -t 0
split-window -v
select-pane -t 0

# Windows / Sessions control
bind-key -n C-Left previous-window
bind-key -n C-Right next-window
bind-key -n C-Up switch-client -p
bind-key -n C-Down switch-client -n

# Panes control
bind-key -n S-Left select-pane -L
bind-key -n S-Right select-pane -R
bind-key -n S-Up select-pane -U
bind-key -n S-Down select-pane -D

# m キーでマウス操作のオンオフを切り替える
bind m run-shell 'if [ "$(tmux show -g -v mouse)" = "on" ]; then tmux set -g mouse off; else tmux set -g mouse on; fi'
# ステータスバーにマウス状態の表示を追加
set -g status-right 'Mouse: #{?mouse,on,off} | %Y-%m-%d %H:%M '
